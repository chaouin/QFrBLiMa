# QFrMark: standardized evaluation configuration
# One judgment per request for all models.
# Fields set to null must be filled using the exact model/dependency version
# used in the run being documented; do not infer them from a display name.

benchmark:
  name: QFrMark
  n_markers: 241
  n_sentence_pairs: 1205
  seed: 42
  evaluation: zero_shot
  task: identify_more_Quebec_French_candidate
  labels:
    - A_MUCH_MORE_FQ
    - A_SLIGHTLY_MORE_FQ
    - EQUIVALENT
    - B_SLIGHTLY_MORE_FQ
    - B_MUCH_MORE_FQ
  equivalent_scored_as_correct: false
  candidate_order:
    randomized: true
    fq_in_A: 602
    fq_in_B: 603
    full_inversion: true
    evaluations_per_pair_per_model: 2

inference:
  batch_size: 1
  output_format: structured_json
  required_output_fields:
    - judgment_id
    - overall_preference
    - dominant_dimension
    - fq_evidence_span
    - fi_evidence_span
    - rationale
  expose_gold_labels_to_model: false

models:
  gemini:
    display_name: Gemini 3.8 Flash
    provider: google
    interface: google_genai.models.generate_content
    model_id: gemini-3.8-flash
    batch_size: 1
    thinking_level: low
    max_output_tokens: 768
    response_mime_type: application/json
    json_schema: true
    api_sdk_version: null

  claude:
    display_name: Claude Opus 4.8
    provider: anthropic
    interface: anthropic.messages.create
    model_id: claude-opus-4-8
    batch_size: 1
    max_output_tokens: 8000
    output_format: json_schema
    max_retries: 5
    sleep_seconds_between_requests: 0.5
    api_sdk_version: null

  gpt54:
    display_name: GPT-5.4
    provider: openai
    interface: openai.responses.create
    model_id: gpt-5.4
    batch_size: 1
    reasoning_effort: none
    max_output_tokens: 768
    output_format: strict_json_schema
    api_sdk_version: null

  gemma4_12b_it:
    display_name: Gemma 4 12B IT
    provider: huggingface_local
    model_repository: google/gemma-4-12B-it
    model_revision: null
    architecture: AutoModelForMultimodalLM
    dtype: auto
    device_map: auto
    do_sample: false
    max_new_tokens: 768
    batch_size: 1

  mistral_nemo_12b:
    display_name: Mistral NeMo 12B Instruct
    provider: huggingface_local
    model_repository: mistralai/Mistral-Nemo-Instruct-2407
    model_revision: null
    architecture: AutoModelForCausalLM
    dtype: bfloat16
    device_map: auto
    do_sample: false
    max_new_tokens: 768
    tokenizer_fix_mistral_regex: true
    batch_size: 1

  qwen3_8b:
    display_name: Qwen3 8B
    provider: huggingface_local
    model_repository: Qwen/Qwen3-8B
    model_revision: null
    architecture: AutoModelForCausalLM
    dtype: bfloat16
    device_map: auto
    do_sample: false
    enable_thinking: false
    max_new_tokens: 768
    batch_size: 1

  aya_expanse_8b:
    display_name: Aya Expanse 8B
    provider: huggingface_local
    model_repository: CohereLabs/aya-expanse-8b
    model_revision: null
    architecture: AutoModelForCausalLM
    dtype: bfloat16
    device_map: auto
    do_sample: false
    max_new_tokens: 768
    batch_size: 1

  llama31_8b:
    display_name: Llama 3.1 8B Instruct
    provider: huggingface_local
    model_repository: meta-llama/Llama-3.1-8B-Instruct
    model_revision: null
    architecture: AutoModelForCausalLM
    dtype: bfloat16
    device_map: auto
    do_sample: false
    max_new_tokens: 768
    batch_size: 1

evaluation_protocol:
  prompt_type: zero_shot
  prompt_source: qfrmark/protocol.py
  candidates_anonymized: true
  gold_labels_hidden: true
  judgments_per_request: 1
  randomization_seed: 42
  position_control:
    method: exhaustive_candidate_swap
    n_pairs: 1205
    original_and_inverted: true
  scoring:
    positive_label: documented_FQ_candidate
    equivalent_is_incorrect: true
    order_robust: correct_in_both_orders

statistical_analysis:
  n_markers: 241
  contexts_per_marker: 5
  bootstrap:
    method: marker_cluster_percentile
    confidence_level: 0.95
    iterations: 20000
    seed: 42
  mcnemar:
    method: exact
    multiple_comparison_correction: holm
  pairwise_comparison:
    method: marker_cluster_sign_flip_permutation
    permutations: 20000
    multiple_comparison_correction: holm

