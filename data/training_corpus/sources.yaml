    original_collection_method: MediaWiki API

    original_filename: wikipedia_quebec_clean_final.txt

    temporal_coverage:
      start: "2008"
      end: "2025"

    source_word_count: 16052632

    upstream_preprocessing:
      - Removal of Wikipedia artifacts
      - Unicode normalization
      - Dehyphenation
      - Number normalization
      - Sentence segmentation
      - Linguistic filtering
      - Document deduplication

    preparation_script: scripts/encoders/corpus/wiki_build.py

    license:
      name: Creative Commons Attribution-ShareAlike 3.0
      identifier: CC-BY-SA-3.0
      url: https://creativecommons.org/licenses/by-sa/3.0/
