schema_version: 1

description: >
  Source inventory for the supervised regional French classification
  corpus used to fine-tune the five encoder-based models evaluated
  on QFrBLiMa.

# ============================================================
# Regional labels
# ============================================================

labels:
  FI:
    id: 0
    name: Metropolitan French
    paper_label: MFr

  FQ:
    id: 1
    name: Quebec French
    paper_label: QFr

# ============================================================
# Shared research corpus collection
# ============================================================

shared_collection:
  hosting_platform: VALERIA
  institution: Université Laval
  storage_type: S3
  access: restricted
  acquisition_method: manual_download

  description: >
    Existing research corpora made available through Université
    Laval's VALERIA infrastructure. The collection includes
    resources documented by Khan et al. (2026), as well as
    additional resources not described in that publication.

  access_note: >
    Access to the shared collection was granted by Richard Khoury
    for academic research purposes. VALERIA serves as the hosting
    infrastructure and is not the original producer of the corpora.

# ============================================================
# References
# ============================================================

references:
  khan-etal-2026-low:
    title: >
      Low-Resource Dialect Adaptation of Large Language Models:
      A French Dialect Case-Study
    authors:
      - Khan, E.
      - Saidani, F.
      - Van Esbroeck, O.
      - Khoury, R.
      - Kosseim, L.
    year: 2026
    venue: Language Resources and Evaluation Conference (LREC)
    url: https://aclanthology.org/2026.lrec-1.840/
    doi: 10.63317/3kg84h4wnshx
    repository: https://github.com/CLaC-Lab/QuebecLLM-CPT

# ============================================================
# Data availability and licensing
# ============================================================

distribution:
  full_corpus_redistributed: false

  reason: >
    Following Khan et al. (2026), raw supervised corpus texts and
    generated training, validation and test splits are not publicly
    redistributed due to copyright and source-specific usage restrictions.

  publicly_available_artifacts:
    - corpus_construction_scripts
    - source_documentation
    - aggregate_corpus_statistics

  license_note: >
    Each source remains subject to its original licensing and
    usage conditions. The repository license does not
    supersede the rights associated with the underlying data.

  checkpoint_redistribution: pending_confirmation
  checkpoint_release_plan:
    platform: Hugging Face
    scope: five fine-tuned regional classifiers
    conditions: >
      Subject to confirmation of the applicable pretrained-model licenses
      and training-data usage permissions. Research access to the shared
      collection does not by itself establish redistribution permission.

# ============================================================
# Corpus sources
# ============================================================

sources:

  # ==========================================================
  # Metropolitan French (FI / MFr)
  # ==========================================================

  # ----------------------------------------------------------
  # Encyclopedic
  # ----------------------------------------------------------

  - id: wikipedia_fr
    name: French Wikipedia and Wikisource
    variety: FI
    genre: encyclopedic

    shared_collection: true
    corpus_name: corpus_wiki_fr_clean
    documented_in_khan_etal_2026: false
    acquisition_method: manual_download

    source_urls:
      - https://fr.wikipedia.org/
      - https://fr.wikisource.org/

    original_filename: corpus_wiki_fr_clean.txt

    temporal_coverage:
      start: "2001"
      end: "2023"

    source_size:
      value: 6.34
      unit: GB

    upstream_preprocessing:
      - Unicode normalization
      - Removal of irrelevant sections
      - Typographical correction
      - Removal of residual wiki artifacts
      - Document deduplication
      - Length filtering

    license:
      name: CC-BY-SA
      version: unspecified
      basis: corpus_metadata

    notes: >
      The original corpus contains pan-Francophone content,
      including texts associated with France, Quebec, Belgium,
      Switzerland and Africa. It is used as a proxy for FI
      rather than an exclusively Metropolitan French corpus.

  # ----------------------------------------------------------
  # Parliamentary
  # ----------------------------------------------------------

  - id: assemblee_fr
    name: French National Assembly
    variety: FI
    genre: parliamentary

    shared_collection: false
    acquisition_method: public_data_download

    source_url: https://data.assemblee-nationale.fr/travaux-parlementaires/debats

    dataset_url: https://www.data.gouv.fr/datasets/comptes-rendus-des-debats-de-l-assemblee-nationale

    source_format: XML

    preparation_script: scripts/encoders/corpus/extract_assemblee.py

    license:
      name: Etalab Open Licence 2.0
      identifier: Etalab-2.0
      url: https://github.com/etalab/licence-ouverte/blob/master/LO.md
      basis: official_source
      attribution_required: true

  # ----------------------------------------------------------
  # Administrative
  # ----------------------------------------------------------

  - id: vie_publique
